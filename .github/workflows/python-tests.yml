name: Python CI & Syntax Sanity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Lint & Validation Tools
      run: |
        python -m pip install --upgrade pip
        pip install spacy pydantic

    - name: Syntax Check
      run: |
        python -m py_compile src/inference.py
        python -m py_compile src/app.py
